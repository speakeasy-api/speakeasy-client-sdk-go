workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    my-source:
        inputs:
            # Authoritative spec, published by speakeasy-registry CI on every merge
            # to main (the www.speakeasy.com copy is a hand-maintained snapshot).
            - location: registry.speakeasyapi.dev/speakeasy-self/speakeasy-self/speakeasy-api:latest
        overlays:
            - location: .speakeasy/overlay-global-security.yaml
        registry:
            location: registry.speakeasyapi.dev/speakeasy-self/speakeasy-self/my-source
targets:
    speakeasy-client-sdk-go:
        target: go
        source: my-source
        codeSamples:
            output: codeSamples.yaml
            registry:
                location: registry.speakeasyapi.dev/speakeasy-self/speakeasy-self/code-samples-go-speakeasy-client-sdk-go
